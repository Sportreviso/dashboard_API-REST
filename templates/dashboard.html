<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard – Umidade do Solo</title>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        #mensagem {
            color: gray;
            font-style: italic;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <h2>Umidade</h2>

    <!-- Mensagem exibida quando não há dados -->
    <p id="mensagem">
        Aguardando dados do sensor…
    </p>

    <!-- Gráfico -->
    <div id="grafico"></div>

    <script>
        function carregarDados() {
            fetch('/data')
                .then(r => r.json())
                .then(d => {
                    const grafico = JSON.parse(d[0]);
                    const mensagem = document.getElementById("mensagem");

                    // Verifica se existem dados
                    if (grafico.data[0].x.length > 0) {
                        mensagem.style.display = "none";
                    } else {
                        mensagem.style.display = "block";
                    }

                    Plotly.newPlot('grafico', grafico.data, grafico.layout);
                })
                .catch(() => {
                    document.getElementById("mensagem").style.display = "block";
                });
        }

        // Carrega ao abrir a página
        carregarDados();

        // Atualiza automaticamente a cada 10 segundos
        setInterval(carregarDados, 10000);
    </script>
</body>
</html>
