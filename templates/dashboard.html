<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Ambiental</title>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>

body{
    background:#ffffff;
    color:#000;
    font-family:Arial,sans-serif;
    padding:20px;
    transition:.3s;
}

body.dark{
    background:#121212;
    color:#ffffff;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.controls{
    text-align:center;
    margin-bottom:15px;
}

button{
    padding:10px 15px;
    cursor:pointer;
    margin:5px;
}

.indicators{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:20px;
}

.indicator{
    background:#edf7ed;
    color:#000;
    padding:12px 20px;
    border-radius:10px;
    text-align:center;
    min-width:130px;
}

body.dark .indicator{
    background:#1f2d1f;
    color:#fff;
}

.chart-card{
    background:#edf7ed;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
}

body.dark .chart-card{
    background:#1f2d1f;
}

#mensagem{
    text-align:center;
    margin-bottom:15px;
    color:gray;
}

</style>
</head>

<body>

<div class="header">

<h1>DASHBOARD AMBIENTAL</h1>

<h3>
<strong>TÍTULO:</strong>
Fazenda Vertical Inteligente
</h3>

<h3>
<strong>TURMA:</strong>
DRP14-001
</h3>

<h3>
<strong>UNIVESP:</strong>
Projeto Integrador em Computação VI -2026
</h3>

</div>

<div class="controls">
<button onclick="alternarTema()">
Tema Claro / Escuro
</button>
</div>

<div class="indicators">

<div class="indicator">
Último valor<br>
<strong id="ultimo">--</strong>
</div>

<div class="indicator">
Média<br>
<strong id="media">--</strong>
</div>

<div class="indicator">
Status<br>
<strong id="status">OFFLINE</strong>
</div>

</div>

<p id="mensagem">
Carregando dados...
</p>

<div class="chart-card">
<div id="grafico_solo"></div>
</div>

<div class="chart-card">
<div id="grafico_umidade_ar"></div>
</div>

<div class="chart-card">
<div id="grafico_temp_ar"></div>
</div>

<div class="chart-card">
<div id="grafico_temp_agua"></div>
</div>

<div class="chart-card">
<div id="grafico_qualidade"></div>
</div>

<script>

let temaAtual="claro";

const CORES={
    claro:{
        plot:"#dff3df",
        grid:"#bad3ba",
        text:"#000"
    },
    escuro:{
        plot:"#2e4a2e",
        grid:"#688468",
        text:"#fff"
    }
};

function alternarTema(){

    temaAtual=
        temaAtual==="claro"
        ? "escuro"
        : "claro";

    document.body.classList.toggle("dark");

    carregarDados();
}

function criarGrafico(
    id,
    titulo,
    x,
    y,
    minimo,
    maximo
){

    const c=CORES[temaAtual];

    Plotly.react(
        id,
        [{
            x:x,
            y:y,
            mode:"lines+markers",
            line:{
                width:3
            }
        }],
        {
            title:{
                text:titulo,
                font:{
                    color:c.text
                }
            },

            xaxis:{
                gridcolor:c.grid
            },

            yaxis:{
                gridcolor:c.grid,
                range:[minimo,maximo]
            },

            plot_bgcolor:c.plot,
            paper_bgcolor:"transparent",
            font:{
                color:c.text
            },

            margin:{
                t:50,
                r:20,
                l:50,
                b:50
            }
        }
    );

}

function media(array){

    const numeros=array.filter(v=>v!==null);

    if(numeros.length===0)
        return 0;

    return (
        numeros.reduce((a,b)=>a+b,0)
        /
        numeros.length
    ).toFixed(1);

}

function carregarDados(){

    fetch("/data")
    .then(r=>r.json())
    .then(d=>{

        criarGrafico(
            "grafico_solo",
            "Umidade do Solo (%)",
            d.tempo,
            d.solo,
            0,
            100
        );

        criarGrafico(
            "grafico_umidade_ar",
            "Umidade do Ar (%)",
            d.tempo,
            d.umidade_ar,
            0,
            100
        );

        criarGrafico(
            "grafico_temp_ar",
            "Temperatura do Ar (°C)",
            d.tempo,
            d.temp_ar,
            0,
            50
        );

        criarGrafico(
            "grafico_temp_agua",
            "Temperatura da Água (°C)",
            d.tempo,
            d.temp_agua,
            0,
            60
        );

        criarGrafico(
            "grafico_qualidade",
            "Qualidade da Água (%)",
            d.tempo,
            d.qualidade_agua,
            0,
            100
        );

        let ultimoSolo =
            d.solo.filter(v=>v!==null).pop();

        if(ultimoSolo!==undefined){

            document.getElementById("status")
                .innerText="ONLINE";

            document.getElementById("ultimo")
                .innerText=
                ultimoSolo.toFixed(1)+" %";

            document.getElementById("media")
                .innerText=
                media(d.solo)+" %";

            document.getElementById("mensagem")
                .style.display="none";

        }

    })
    .catch(err=>{

        console.error(err);

        document.getElementById("status")
            .innerText="ERRO";

    });

}

carregarDados();

setInterval(
    carregarDados,
    10000
);

</script>

</body>
</html>
``
