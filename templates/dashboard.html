<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Umidade do Solo</title>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <style>
        :root {
            /* Tema claro */
            --bg-color: #ffffff;
            --text-color: #000000;
            --card-color: #edf7ed;
            --plot-bg: #dff3df;

            /* Tema escuro */
            --bg-dark: #0f0f0f;
            --text-dark: #ffffff;
            --card-dark: #1f2d1f;
            --plot-dark: #2e4a2e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            transition: background-color .35s ease, color .35s ease;
        }

        body.dark {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h3 {
            font-size: 14px;
            font-weight: normal;
            margin: 3px 0;
        }

        .controls {
            text-align: center;
            margin-bottom: 15px;
        }

        button {
            padding: 8px 14px;
            margin: 4px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #ccc;
            transition: background-color .25s ease;
        }

        .indicators {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .indicator {
            background-color: var(--card-color);
            padding: 10px 18px;
            border-radius: 8px;
            min-width: 150px;
            text-align: center;
            transition: background-color .35s ease;
        }

        body.dark .indicator {
            background-color: var(--card-dark);
        }

        .indicator strong {
            font-size: 18px;
        }

        #mensagem {
            text-align: center;
            font-style: italic;
            color: gray;
            margin-bottom: 10px;
        }

        .chart-card {
            background-color: var(--card-color);
            padding: 16px;
            border-radius: 12px;
            transition: background-color .35s ease;
        }

        body.dark .chart-card {
            background-color: var(--card-dark);
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>DASHBOARD UMIDADE DO SOLO</h1>
        <h3><strong>TÍTULO:</strong> Coleta e Processamento de Dados na Automação de Irrigação de Área com Erosão</h3>
        <h3><strong>TURMA:</strong> DRP14-PJI510-A2026S1N1</h3>
        <h3><strong>GRUPO:</strong> 15 – UNIVESP 2026</h3>
    </div>

    <div class="controls">
        <button onclick="alternarTema()">Tema Claro / Escuro</button>
        <button onclick="exportarCSV()">Exportar CSV</button>
    </div>

    <div class="indicators">
        <div class="indicator">Último valor<br><strong id="ultimo">-- %</strong></div>
        <div class="indicator">Média<br><strong id="media">-- %</strong></div>
        <div class="indicator">Status<br><strong id="status">SEM DADOS</strong></div>
    </div>

    <p id="mensagem">Aguardando dados do sensor…</p>

    <div class="chart-card">
        <div id="grafico"></div>
    </div>

    <script>
        let dadosCSV = [];
        let ultimoLayout;

        function alternarTema() {
            document.body.classList.toggle("dark");
            aplicarTemaNoGrafico();
        }

        function aplicarTemaNoGrafico() {
            if (!ultimoLayout) return;

            const escuro = document.body.classList.contains("dark");

            Plotly.relayout("grafico", {
                "title.font.color": escuro ? "#fff" : "#000",
                "xaxis.tickfont.color": escuro ? "#fff" : "#000",
                "yaxis.tickfont.color": escuro ? "#fff" : "#000",
                "xaxis.gridcolor": escuro ? "#6f8f6f" : "#c0d9c0",
                "yaxis.gridcolor": escuro ? "#6f8f6f" : "#c0d9c0",
                "plot_bgcolor": escuro ? "var(--plot-dark)" : "var(--plot-bg)"
            });
        }

        function exportarCSV() {
            let csv = "\uFEFFData;Último valor (%);Média (%);Umidade (%);Tempo\n";

            if (dadosCSV.length === 0) {
                csv += "Sem dados;Sem dados;Sem dados;Sem dados;Sem dados\n";
            } else {
                const ultimo = dadosCSV.at(-1).y;
                const media = dadosCSV.reduce((s, i) => s + i.y, 0) / dadosCSV.length;

                dadosCSV.forEach(i => {
                    csv += `${i.x.split("T")[0]};${ultimo.toFixed(1)};${media.toFixed(1)};${i.y.toFixed(1)};${i.x}\n`;
                });
            }

            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "umidade_solo.csv";
            link.click();
        }

        function carregarDados() {
            fetch("/data")
                .then(r => r.json())
                .then(d => {
                    const payload = JSON.parse(d[0]);
                    const x = payload.data[0].x;
                    const y = payload.data[0].y;

                    dadosCSV = x.map((v, i) => ({ x: v, y: y[i] }));
                    const escuro = document.body.classList.contains("dark");

                    const trace = y.length > 0 ? {
                        x, y,
                        type: "scatter",
                        mode: "lines+markers",
                        marker: { size: 6, color: y.map(v => v < 0 ? "red" : "green") },
                        line: { width: 3 }
                    } : {
                        x:[0,1], y:[0,0],
                        type:"scatter", mode:"lines",
                        line:{dash:"dot", width:2, color:"#6fa96f"}
                    };

                    const layout = {
                        title: { text:"Umidade do Solo (%)", font:{size:18, color: escuro?"#fff":"#000"} },
                        xaxis:{ visible: y.length>0, gridcolor: escuro?"#6f8f6f":"#c0d9c0" },
                        yaxis:{ range:[0,100], gridcolor: escuro?"#6f8f6f":"#c0d9c0" },
                        plot_bgcolor: escuro ? "var(--plot-dark)" : "var(--plot-bg)",
                        paper_bgcolor: "transparent"
                    };

                    ultimoLayout = layout;

                    Plotly.react("grafico", [trace], layout, { responsive:true });

                    aplicarTemaNoGrafico();
                });
        }

        carregarDados();
        setInterval(carregarDados, 10000);
    </script>
</body>
</html>
