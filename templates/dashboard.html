<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Umidade do Solo</title>

    <!-- ✅ IMPORTAÇÃO CORRETA DO PLOTLY -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --card-color: #eaf5ea;
        }

        body.dark {
            --bg-color: #121212;
            --text-color: #ffffff;
            --card-color: #1e2a1e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        .header h3 {
            margin: 2px 0;
            font-weight: normal;
            font-size: 14px;
        }

        .controls {
            text-align: center;
            margin-bottom: 15px;
        }

        button {
            padding: 8px 12px;
            margin: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .indicators {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .indicator {
            background-color: var(--card-color);
            padding: 10px 15px;
            border-radius: 8px;
            min-width: 150px;
            text-align: center;
            font-size: 14px;
        }

        .indicator strong {
            font-size: 18px;
        }

        #mensagem {
            text-align: center;
            color: gray;
            font-style: italic;
            margin-bottom: 10px;
        }

        .chart-card {
            background-color: var(--card-color);
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <!-- CABEÇALHO -->
    <div class="header">
        <h1>DASHBOARD UMIDADE DO SOLO</h1>
        <h3><strong>TÍTULO:</strong> Coleta e Processamento de Dados na Automação de Irrigação de Área com Erosão</h3>
        <h3><strong>TURMA:</strong> DRP14-PJI510-A2026S1N1</h3>
        <h3><strong>GRUPO:</strong> 15 – UNIVESP 2026</h3>
    </div>

    <!-- CONTROLES -->
    <div class="controls">
        <button onclick="alternarTema()">Tema Claro / Escuro</button>
        <button onclick="exportarCSV()">Exportar CSV</button>
    </div>

    <!-- INDICADORES -->
    <div class="indicators">
        <div class="indicator">
            Último valor<br><strong id="ultimo">-- %</strong>
        </div>
        <div class="indicator">
            Média<br><strong id="media">-- %</strong>
        </div>
        <div class="indicator">
            Status<br><strong id="status">SEM DADOS</strong>
        </div>
    </div>

    <!-- MENSAGEM -->
    <p id="mensagem">Aguardando dados do sensor…</p>

    <!-- GRÁFICO -->
    <div class="chart-card">
        <div id="grafico"></div>
    </div>

    <script>
        let dadosCSV = [];

        function alternarTema() {
            document.body.classList.toggle("dark");
        }

       function exportarCSV() {
    // BOM para Excel reconhecer UTF-8 corretamente
    let csv = "\uFEFFData;Último valor (%);Média (%);Umidade (%);Tempo\n";

    if (dadosCSV.length === 0) {
        csv += "Sem dados;Sem dados;Sem dados;Sem dados;Sem dados\n";
    } else {
        const ultimoValor = dadosCSV[dadosCSV.length - 1].y;
        const media =
            dadosCSV.reduce((soma, item) => soma + item.y, 0) /
            dadosCSV.length;

        dadosCSV.forEach(item => {
            const data = item.x.split("T")[0];
            csv += `${data};${ultimoValor.toFixed(1)};${media.toFixed(1)};${item.y.toFixed(1)};${item.x}\n`;
        });
    }

    const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
    });

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "umidade_solo.csv";
    link.click();
}

        function calcularMedia(valores) {
            return valores.reduce((a, b) => a + b, 0) / valores.length;
        }

        function carregarDados() {
            fetch('/data')
                .then(r => r.json())
                .then(d => {
                    const payload = JSON.parse(d[0]);
                    const x = payload.data[0].x;
                    const y = payload.data[0].y;

                    dadosCSV = x.map((v, i) => ({ x: v, y: y[i] }));

                    let trace;

                    if (y.length > 0) {
                        // ✅ DADOS REAIS
                        trace = {
                            x: x,
                            y: y,
                            type: "scatter",
                            mode: "lines+markers",
                            name: "Umidade do Solo",
                            line: { width: 3, color: "green" },
                            marker: {
                                size: 6,
                                color: y.map(v => v < 0 ? "red" : "green")
                            }
                        };

                        document.getElementById("mensagem").style.display = "none";
                        document.getElementById("status").innerText = "ONLINE";
                        document.getElementById("ultimo").innerText =
                            y[y.length - 1].toFixed(1) + " %";
                        document.getElementById("media").innerText =
                            calcularMedia(y).toFixed(1) + " %";

                    } else {
                        // ✅ LINHA VISUAL QUANDO NÃO HÁ DADOS
                        trace = {
                            x: [0, 1],
                            y: [0, 0],
                            type: "scatter",
                            mode: "lines",
                            name: "Aguardando dados",
                            line: {
                                width: 2,
                                dash: "dot",
                                color: "#6a9e6a"
                            }
                        };

                        document.getElementById("mensagem").style.display = "block";
                        document.getElementById("status").innerText = "SEM DADOS";
                        document.getElementById("ultimo").innerText = "-- %";
                        document.getElementById("media").innerText = "-- %";
                    }

                    const temaEscuro = document.body.classList.contains("dark");

const layout = {
    title: {
        text: "Umidade do Solo (%)",
        font: {
            color: temaEscuro ? "#ffffff" : "#000000",
            size: 18
        }
    },
    xaxis: {
        title: {
            text: "Tempo",
            font: { color: temaEscuro ? "#ffffff" : "#000000" }
        },
        tickfont: { color: temaEscuro ? "#ffffff" : "#000000" },
        gridcolor: temaEscuro ? "#666666" : "#cccccc",
        visible: y.length > 0
    },
    yaxis: {
        title: {
            text: "Umidade (%)",
            font: { color: temaEscuro ? "#ffffff" : "#000000" }
        },
        tickfont: { color: temaEscuro ? "#ffffff" : "#000000" },
        range: [0, 100],
        gridcolor: temaEscuro ? "#666666" : "#cccccc"
    },
    plot_bgcolor: temaEscuro ? "#2f4f2f" : "#d6f2d6",
    paper_bgcolor: "transparent",
    font: {
        size: 14,
        color: temaEscuro ? "#ffffff" : "#000000"
    }
};

                    Plotly.newPlot("grafico", [trace], layout);
                });
        }

        carregarDados();
        setInterval(carregarDados, 10000);
    </script>
</body>
</html>
