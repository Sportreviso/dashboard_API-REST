<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard Umidade do Solo</title>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>
body {
    background:#ffffff;
    color:#000;
    font-family:Arial, sans-serif;
    padding:20px;
    transition:background .3s, color .3s;
}

body.dark {
    background:#0f0f0f;
    color:#fff;
}

.header{text-align:center;margin-bottom:20px;}
.header h3{font-size:14px;font-weight:normal;margin:3px}

.controls{text-align:center;margin-bottom:15px}
button{padding:8px 14px;cursor:pointer}

.indicators{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:15px
}

.indicator{
    background:#edf7ed;
    padding:10px 18px;
    border-radius:8px;
}

body.dark .indicator{background:#1f2d1f}

.indicator strong{
    font-weight:600;
}

.chart-card{
    background:#edf7ed;
    padding:16px;
    border-radius:12px;
}

body.dark .chart-card{background:#1f2d1f}

#mensagem{
    text-align:center;
    color:gray;
    font-style:italic;
    margin-bottom:10px
}
</style>
</head>

<body>

<div class="header">
<h1>DASHBOARD UMIDADE DO SOLO</h1>
<h3><strong>TÍTULO:</strong> Coleta e Processamento de Dados na Automação de Irrigação de Área com Erosão</h3>
<h3><strong>TURMA:</strong> DRP14-PJI510-A2026S1N1</h3>
<h3><strong>GRUPO:</strong> 15 – UNIVESP 2026</h3>
</div>

<div class="controls">
<button onclick="alternarTema()">Tema Claro / Escuro</button>
<button onclick="exportarCSV()">Exportar CSV</button>
</div>

<div class="indicators">
<div class="indicator">Último valor<br><strong id="ultimo">-- %</strong></div>
<div class="indicator">Média<br><strong id="media">-- %</strong></div>
<div class="indicator">Status<br><strong id="status">SEM DADOS</strong></div>
</div>

<p id="mensagem">Aguardando dados do sensor…</p>

<div class="chart-card">
<div id="grafico"></div>
</div>

<script>
let temaAtual = "claro";
let dadosX = [];
let dadosY = [];

const CORES = {
    claro:{ plot:"#dff3df", grid:"#c0d9c0", text:"#000" },
    escuro:{ plot:"#2e4a2e", grid:"#6f8f6f", text:"#fff" }
};

function corrigirCoresValores() {
    const cor = temaAtual === "escuro" ? "#ffffff" : "#000000";

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            ["status","ultimo","media"].forEach(id=>{
                const el = document.getElementById(id);
                if (el) el.style.color = cor;
            });
        });
    });
}

function alternarTema(){
    temaAtual = temaAtual === "claro" ? "escuro" : "claro";
    document.body.classList.toggle("dark");
    atualizarLayout();
    corrigirCoresValores();
}

function atualizarLayout(){
    const c = CORES[temaAtual];
    Plotly.relayout("grafico", {
        plot_bgcolor: c.plot,
        "xaxis.gridcolor": c.grid,
        "yaxis.gridcolor": c.grid,
        "xaxis.tickfont.color": c.text,
        "yaxis.tickfont.color": c.text,
        "title.font.color": c.text
    });
}

function carregarDados(){
    fetch("/data")
    .then(r=>r.json())
    .then(d=>{
        const g = JSON.parse(d[0]);
        dadosX = g.data[0].x;
        dadosY = g.data[0].y;
        atualizarGrafico();
    });
}

function atualizarGrafico(){
    const c = CORES[temaAtual];

    const trace = dadosY.length
        ? {x:dadosX,y:dadosY,mode:"lines+markers",line:{width:3}}
        : {x:[0,1],y:[0,0],mode:"lines",line:{dash:"dot",width:2,color:"#6fa96f"}};

    Plotly.react("grafico",[trace],{
        title:{text:"Umidade do Solo (%)",font:{color:c.text}},
        xaxis:{gridcolor:c.grid,visible:dadosY.length>0},
        yaxis:{gridcolor:c.grid,range:[0,100]},
        plot_bgcolor:c.plot,
        paper_bgcolor:"transparent"
    });

    if(dadosY.length){
        document.getElementById("status").innerText="ONLINE";
        document.getElementById("ultimo").innerText=dadosY.at(-1)+" %";
        document.getElementById("media").innerText=
            (dadosY.reduce((a,b)=>a+b,0)/dadosY.length).toFixed(1)+" %";
        document.getElementById("mensagem").style.display="none";
    }else{
        document.getElementById("mensagem").style.display="block";
    }

    corrigirCoresValores();
}

function exportarCSV(){
    let csv="\uFEFFData;Valor\n";
    dadosX.forEach((x,i)=>csv+=`${x};${dadosY[i]}\n`);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
    a.download="umidade.csv";
    a.click();
}

carregarDados();
setInterval(carregarDados,10000);
</script>

</body>
</html>
